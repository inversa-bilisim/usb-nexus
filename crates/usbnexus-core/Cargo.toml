[package]
name = "usbnexus-core"
description = "USB Nexus core: secure transport, pairing, discovery, reconnect and device backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
usbnexus-proto = { workspace = true, features = ["serde"] }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rcgen.workspace = true
spake2.workspace = true
sha2.workspace = true
hmac.workspace = true
rand.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
mdns-sd.workspace = true
tracing.workspace = true
subtle.workspace = true

# Userspace USB access (macOS device sharing; optional elsewhere).
rusb = { version = "0.9", features = ["vendored"], optional = true }

[features]
# Build the libusb device host on platforms other than macOS (for testing,
# or as an alternative to the in-kernel usbip-host driver on Linux).
libusb = ["dep:rusb"]

[target.'cfg(target_os = "macos")'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Usb",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
