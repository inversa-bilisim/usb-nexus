[package]
name = "usbnexus-cli"
description = "USB Nexus command line tool and daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "usbnexus"
path = "src/main.rs"

[dependencies]
usbnexus-core.workspace = true
usbnexus-proto.workspace = true
usbnexus-i18n.workspace = true
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
serde_json.workspace = true
serde.workspace = true
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

# `cargo deb -p usbnexus-cli` (after `cargo build --release -p usbnexus-cli`)
[package.metadata.deb]
name = "usbnexus"
maintainer = "USB Nexus contributors"
copyright = "2026, USB Nexus contributors"
license-file = ["../../LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """\
USB Nexus shares USB devices over the network with TLS encryption, PIN \
pairing, automatic discovery and automatic reconnection. This package \
contains the usbnexus command line tool and the background service. \
The kernel's usbip-host and vhci-hcd modules are required (on Ubuntu \
they are in linux-modules-extra, which the standard kernel packages \
already pull in)."""
depends = "$auto, systemd"
recommends = "usb-nexus"
maintainer-scripts = "../../packaging/linux/debian"
assets = [
    ["target/release/usbnexus", "usr/bin/", "755"],
    ["../../packaging/linux/usbnexus.service", "usr/lib/systemd/system/usbnexus.service", "644"],
    ["../../packaging/linux/usbnexus.sysusers", "usr/lib/sysusers.d/usbnexus.conf", "644"],
    ["../../README.md", "usr/share/doc/usbnexus/README.md", "644"],
]

# `cargo generate-rpm -p crates/usbnexus-cli` (after the release build)
[package.metadata.generate-rpm]
name = "usbnexus"
summary = "Secure USB over IP: command line tool and service"
license = "GPL-3.0-or-later"
post_install_script = "../../packaging/linux/rpm/post.sh"
pre_uninstall_script = "../../packaging/linux/rpm/preun.sh"
post_uninstall_script = "../../packaging/linux/rpm/postun.sh"
assets = [
    { source = "target/release/usbnexus", dest = "/usr/bin/usbnexus", mode = "755" },
    { source = "../../packaging/linux/usbnexus.service", dest = "/usr/lib/systemd/system/usbnexus.service", mode = "644" },
    { source = "../../packaging/linux/usbnexus.sysusers", dest = "/usr/lib/sysusers.d/usbnexus.conf", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/usbnexus/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
systemd = "*"

# Fedora/RHEL keep the usbip-host and vhci-hcd kernel modules here; dnf
# installs weak dependencies by default (openSUSE has no such package and
# ignores it).
[package.metadata.generate-rpm.recommends]
kernel-modules-extra = "*"
