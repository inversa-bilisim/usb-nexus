[workspace]
resolver = "2"
members = [
    "crates/usbnexus-proto",
    "crates/usbnexus-core",
    "crates/usbnexus-i18n",
    "crates/usbnexus-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/inversa-bilisim/usb-nexus"

[workspace.dependencies]
usbnexus-proto = { path = "crates/usbnexus-proto" }
usbnexus-core = { path = "crates/usbnexus-core" }
usbnexus-i18n = { path = "crates/usbnexus-i18n" }
fluent-bundle = "0.16"
unic-langid = "0.9"
anyhow = "1"
thiserror = "2"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
spake2 = "0.4"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.13"
clap = { version = "4", features = ["derive", "string"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
subtle = "2"
