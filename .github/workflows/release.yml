name: Release

# Builds installable packages. Runs on version tags (v1.2.3) and publishes a
# draft GitHub release; can also be started by hand to just build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo install tauri-cli --version "^2" --locked
      - name: Service and CLI packages
        run: |
          cargo build --release -p usbnexus-cli
          cargo deb -p usbnexus-cli --no-build
          cargo generate-rpm -p crates/usbnexus-cli
      - name: Desktop app packages
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --config ../../../packaging/linux/tauri.bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Service executable (bundled as a sidecar)
        shell: pwsh
        run: |
          cargo build --release -p usbnexus-cli
          New-Item -ItemType Directory -Force apps\desktop\src-tauri\binaries | Out-Null
          Copy-Item target\release\usbnexus.exe apps\desktop\src-tauri\binaries\usbnexus-x86_64-pc-windows-msvc.exe
      - name: Bundled usbip-win2 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/windows/fetch-usbip-win2.ps1
      - name: Installer
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --config ../../../packaging/windows/tauri.bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Package
        run: packaging/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/*.pkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
